name: Build and Linter Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linter-and-types:
    name: Build, type check and linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      - name: Linter test
        run: pnpm run lint:check

      - name: ESLint config dogfood
        run: pnpm run lint:eslint
