name: Unit Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # `^` keeps the latest patch of each major while enforcing the
          # devEngines floor (>= 22.23.4 / 24.22.1 / 26.13.0).
          - "^22.23.4"
          - "^24.22.1"
          - "^26.13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Unit test
        run: pnpm run test:coverage

      - name: Stylelint config test
        run: pnpm run test:stylelint
